<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jubileu CRM</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
            background-color: #1e1e1e;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 100%;
        }

        h1 {
            color: #00e676;
            margin-bottom: 2rem;
        }

        button {
            background-color: #00a884;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            width: 100%;
            font-weight: bold;
        }

        button:hover {
            background-color: #008f6f;
        }

        button:disabled {
            background-color: #4a4a4a;
            cursor: not-allowed;
        }

        #qr-container {
            margin-top: 2rem;
            display: none;
            background: white;
            padding: 10px;
            border-radius: 8px;
        }

        #qr-image {
            width: 100%;
            max-width: 250px;
        }

        #status {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #b0b0b0;
            min-height: 20px;
        }

        .logs {
            margin-top: 20px;
            text-align: left;
            font-family: monospace;
            font-size: 12px;
            color: #888;
            max-height: 100px;
            overflow-y: auto;
            border-top: 1px solid #333;
            padding-top: 10px;
            width: 100%;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Jubileu CRM</h1>
        <button id="connect-btn">Conectar WhatsApp</button>
        <div id="status">Aguardando ação...</div>

        <div id="qr-container">
            <img id="qr-image" alt="QR Code">
            <p style="color: #333; margin-top: 5px;">Escaneie com seu WhatsApp</p>
        </div>

        <div class="logs" id="logs"></div>
    </div>

    <script>
        const connectBtn = document.getElementById('connect-btn');
        const qrContainer = document.getElementById('qr-container');
        const qrImage = document.getElementById('qr-image');
        const statusDiv = document.getElementById('status');
        const logsDiv = document.getElementById('logs');

        function addLog(msg) {
            const p = document.createElement('div');
            p.textContent = `> ${msg}`;
            logsDiv.appendChild(p);
            logsDiv.scrollTop = logsDiv.scrollHeight;
        }

        connectBtn.addEventListener('click', async () => {
            connectBtn.disabled = true;
            connectBtn.textContent = 'Iniciando...';
            statusDiv.textContent = 'Inicializando cliente...';

            try {
                await window.api.connectWhatsapp();
            } catch (error) {
                console.error(error);
                statusDiv.textContent = 'Erro ao iniciar';
                connectBtn.disabled = false;
            }
        });

        window.api.onQrCode((qr) => {
            statusDiv.textContent = 'QR Code recebido via terminal/backend';
            // Gera QR Code localmente ou recebe imagem base64? 
            // O plano dizia backend retorna QR Code. Vamos supor que o backend manda DataURL.
            qrImage.src = qr;
            qrContainer.style.display = 'block';
            statusDiv.textContent = 'Por favor, escaneie o código';
            addLog('QR Code recebido');
        });

        window.api.onConnected(() => {
            statusDiv.textContent = 'Conectado com sucesso!';
            statusDiv.style.color = '#00e676';
            qrContainer.style.display = 'none';
            connectBtn.textContent = 'WhatsApp Conectado';
            addLog('Cliente conectado!');
        });

        window.api.onLog((msg) => {
            addLog(msg);
        });
    </script>
</body>

</html>
