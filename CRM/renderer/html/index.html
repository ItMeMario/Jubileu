<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM WhatsApp</title>
    <link rel="stylesheet" href="../css/globalCss.css">
    <link rel="stylesheet" href="../css/instances.css">
    <link rel="stylesheet" href="../css/darkMode.css">
</head>

<body>
    <div class="container">
        <!-- Status global -->
        <div id="status" class="hidden"></div>

        <section class="instances-section" style="border: none;">
            <div class="instances-header">
                <h2>
                    📱 Conexão WhatsApp CRM
                </h2>
                <button id="btn-config" class="btn" style="background-color: #0c5460; color: white;">⚙️
                    Configurações</button>
            </div>

            <!-- Grid de cards (Usei a mesma estrutura mas focado em um só card) -->
            <div id="instances-grid" class="instances-grid">

                <div class="instance-card" id="main-card">
                    <!-- Header -->
                    <div class="instance-card-header">
                        <div class="instance-name">
                            <span class="name-text">CRM Principal</span>
                        </div>
                        <span id="connection-badge" class="status-badge disconnected">Desconectado</span>
                    </div>

                    <!-- Body -->
                    <div class="instance-card-body">
                        <!-- Placeholder (quando desconectado) -->
                        <div id="placeholder-view" class="instance-placeholder">
                            <div class="placeholder-icon">📴</div>
                            <div class="placeholder-text">Aguardando inicialização...</div>
                        </div>

                        <!-- QR Code -->
                        <div id="qr-view" class="instance-qr-container" style="display: none;">
                            <img id="qr-image" class="qr-image" src="" alt="QR Code">
                            <div class="qr-hint">Escaneie com seu WhatsApp</div>
                        </div>

                        <!-- Loading -->
                        <div id="loading-view" class="instance-loading" style="display: none;">
                            <div class="spinner"></div>
                            <div class="loading-text">Conectando...</div>
                        </div>

                        <!-- Info (quando conectado) -->
                        <div id="connected-view" class="instance-info" style="display: none;">
                            <div class="phone-number">Conectado</div>
                            <div class="connection-status">✅ WhatsApp Pronto</div>
                        </div>
                    </div>

                    <!-- Footer -->
                    <div class="instance-card-footer">
                        <!-- Botões se necessário, por enquanto automático -->
                        <span style="font-size: 0.8rem; color: #666;">Sistema Automático</span>
                    </div>
                </div>

            </div>
        </section>
    </div>

    <!-- Dark Mode Toggle Button sera injetado pelo manager -->

    <script src="../guiScripts/utils/darkModeManager.js"></script>
    <script src="../guiScripts/renderer.js"></script>
</body>

</html>
