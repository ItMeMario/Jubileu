<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zwei Chat Premium - Central Institucional e Privacidade</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #131b2e;
      --border: #1e293b;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --primary: #25d366;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      max-width: 600px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }
    .logo {
      font-size: 2.5rem;
      margin-bottom: 12px;
    }
    h1 { font-size: 1.8rem; color: #fff; margin-bottom: 8px; }
    p { color: var(--text-muted); font-size: 1rem; margin-bottom: 28px; }
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: block;
      padding: 12px 20px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: rgba(37, 211, 102, 0.15);
      border-color: var(--primary);
      color: #fff;
    }
    .footer {
      margin-top: 32px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">💬</div>
    <h1>Zwei Chat Premium</h1>
    <p>Central de Privacidade, Termos e Conformidade com a Meta WhatsApp Cloud API.</p>

    <div class="links">
      <a class="btn" href="privacy.html">🔒 Política de Privacidade</a>
      <a class="btn" href="terms.html">📄 Termos de Serviço</a>
      <a class="btn" href="deletion.html">🗑️ Exclusão de Dados do Usuário</a>
    </div>

    <div class="footer">
      &copy; 2026 Zwei Chat Premium &bull; Suporte: zweichat@gmail.com
    </div>
  </div>
</body>
</html>
