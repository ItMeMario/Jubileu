<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' https://graph.facebook.com https://*.googleapis.com ws: wss:;">
  <title>Zwei Chat Premium - Meta WhatsApp Cloud API</title>
  <link rel="stylesheet" href="../css/index.css">
</head>
<body>
  <div class="app-container">
    <!-- Barra Lateral de Navegação -->
    <aside class="sidebar">
      <div class="brand-header">
        <div class="brand-logo-icon">⚡</div>
        <div class="brand-info">
          <h1>Zwei Chat</h1>
          <span class="brand-badge">PREMIUM (META API)</span>
        </div>
      </div>

      <nav class="nav-menu">
        <div class="nav-item active" data-tab="tab-dashboard" id="nav-dashboard">
          <span class="nav-icon">📊</span>
          <span>Dashboard</span>
        </div>
        <div class="nav-item" data-tab="tab-templates" id="nav-templates">
          <span class="nav-icon">📄</span>
          <span>Templates Meta</span>
        </div>
        <div class="nav-item" data-tab="tab-broadcast" id="nav-broadcast">
          <span class="nav-icon">🚀</span>
          <span>Disparador Oficial</span>
        </div>
        <div class="nav-item" data-tab="tab-flows" id="nav-flows">
          <span class="nav-icon">🤖</span>
          <span>Fluxos & Bot</span>
        </div>
        <div class="nav-item" data-tab="tab-settings" id="nav-settings">
          <span class="nav-icon">⚙️</span>
          <span>Configurações</span>
        </div>
      </nav>

      <div class="sidebar-footer">
        <!-- Widget Persistente do Cloudflare Tunnel Watchdog -->
        <div class="tunnel-widget-container" id="tunnel-status-widget" title="Verificando status do túnel...">
          <div class="tunnel-widget-left">
            <span class="status-dot status-dot-pulse status-dot-yellow" id="tunnel-status-dot"></span>
            <div class="tunnel-info-text">
              <span class="tunnel-title">Túnel Cloudflare</span>
              <span class="tunnel-subtext" id="tunnel-status-text">Verificando...</span>
            </div>
          </div>
          <button type="button" class="btn-tunnel-refresh" id="btn-tunnel-reconnect" title="Forçar Reconexão do Túnel">
            <span>🔄</span>
          </button>
        </div>

        <div class="bot-switch-container">
          <span>Chatbot Ativo</span>
          <label class="switch">
            <input type="checkbox" id="toggle-bot-switch" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </aside>

    <!-- Área de Conteúdo Principal (Injetada via templateLoader) -->
    <main class="main-content" id="main-content">
      <!-- As abas (dashboard, templates, broadcast, flows, settings) são carregadas dinamicamente a partir de tabs/ -->
    </main>
  </div>

  <script type="module" src="../guiScripts/utils/confirmModal.js"></script>
  <script type="module" src="../guiScripts/appGui.js"></script>
</body>
</html>
