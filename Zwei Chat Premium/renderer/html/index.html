<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zwei Chat Premium - Meta WhatsApp Cloud API</title>
  <link rel="stylesheet" href="../css/premium.css">
</head>
<body>
  <div class="app-container">
    <!-- Barra Lateral de Navegação -->
    <aside class="sidebar">
      <div class="brand-header">
        <div class="brand-logo-icon">⚡</div>
        <div class="brand-info">
          <h1>Zwei Chat</h1>
          <span class="brand-badge">PREMIUM (META API)</span>
        </div>
      </div>

      <nav class="nav-menu">
        <div class="nav-item active" data-tab="tab-dashboard" id="nav-dashboard">
          <span class="nav-icon">📊</span>
          <span>Dashboard</span>
        </div>
        <div class="nav-item" data-tab="tab-templates" id="nav-templates">
          <span class="nav-icon">📄</span>
          <span>Templates Meta</span>
        </div>
        <div class="nav-item" data-tab="tab-broadcast" id="nav-broadcast">
          <span class="nav-icon">🚀</span>
          <span>Disparador Oficial</span>
        </div>
        <div class="nav-item" data-tab="tab-flows" id="nav-flows">
          <span class="nav-icon">🤖</span>
          <span>Fluxos & Bot</span>
        </div>
        <div class="nav-item" data-tab="tab-settings" id="nav-settings">
          <span class="nav-icon">⚙️</span>
          <span>Configurações</span>
        </div>
      </nav>

      <div class="sidebar-footer">
        <div class="bot-switch-container">
          <span>Chatbot Ativo</span>
          <label class="switch">
            <input type="checkbox" id="toggle-bot-switch" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </aside>

    <!-- Área de Conteúdo Principal (Injetada via templateLoader) -->
    <main class="main-content" id="main-content">
      <!-- As abas (dashboard, templates, broadcast, flows, settings) são carregadas dinamicamente a partir de tabs/ -->
    </main>
  </div>

  <script type="module" src="../guiScripts/utils/confirmModal.js"></script>
  <script type="module" src="../guiScripts/appGui.js"></script>
</body>
</html>
