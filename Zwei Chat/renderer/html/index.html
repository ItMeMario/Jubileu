<!-- renderer/html/index.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zwei Chat - WhatsApp Bot Lite</title>
  <link rel="stylesheet" href="../css/index.css">
  <link rel="stylesheet" href="../css/deejay.css">
  <link rel="stylesheet" href="../css/flows.css">
</head>
<body>
  <div class="app-container">
    
    <!-- Sidebar / Painel de Controle -->
    <aside class="glass-panel sidebar">
      <div>
        <div class="brand-section">
          <div class="brand-logo">Z</div>
          <h1 class="brand-title">Zwei Chat</h1>
        </div>
        
        <!-- Seção de Múltiplas Instâncias -->
        <div class="instances-section">
          <div class="instances-header">
            <h3>Instâncias WhatsApp</h3>
            <button id="btn-add-instance" class="icon-btn-add" title="Adicionar Instância">➕</button>
          </div>
          <div id="instances-list" class="instances-list">
            <!-- Renderizado dinamicamente -->
            <div class="instances-placeholder">Nenhuma instância cadastrada</div>
          </div>
        </div>

        <div class="status-widget">
          <div class="status-info">
            <span class="status-label">Status da Conexão</span>
            <span id="status-text" class="status-value">
              <span id="status-dot" class="status-indicator not_initialized"></span>
              Desconectado
            </span>
          </div>
        </div>

        <div class="qr-container">
          <!-- Spinner de Carregamento -->
          <div id="qr-loading" class="qr-loading">
            <div class="spinner"></div>
            <p>Carregando WhatsApp Web...</p>
          </div>

          <!-- Placeholder inicial -->
          <div id="qr-placeholder" class="qr-placeholder">
            <div class="qr-placeholder-icon">📱</div>
            <p>Clique em <strong>Iniciar</strong> para gerar o QR Code de conexão.</p>
          </div>

          <!-- Imagem do QR Code -->
          <img id="qr-img" class="qr-image" src="" alt="QR Code WhatsApp">
        </div>
      </div>

      <div>
        <div class="action-buttons">
          <button id="btn-start" class="btn btn-primary">
            <span>▶</span> Iniciar WhatsApp
          </button>
          <button id="btn-stop" class="btn btn-danger" disabled>
            <span>■</span> Desconectar
          </button>
        </div>
        <p class="footer-text">Zwei Chat v1.0.0 • Jubileu Lite Core</p>
      </div>
    </aside>

    <!-- Main / Painel Principal com Abas -->
    <main class="glass-panel main-panel">
      
      <!-- Cabeçalho com Abas de Navegação -->
      <header class="panel-header">
        <div class="tabs-navigation">
          <button id="tab-btn-logs" class="tab-btn active">
            <span>📊</span> Console de Logs
          </button>
          <button id="tab-btn-flows" class="tab-btn">
            <span>⚙️</span> Editor de Fluxo
          </button>
          <button id="tab-btn-deejay" class="tab-btn">
            <span>🎧</span> Dee Jay
          </button>
        </div>
        <div class="header-actions">
          <div id="logs-controls" class="tab-controls active">
            <button id="btn-clear-logs" class="control-btn" title="Limpar Console">🗑️</button>
          </div>
          <div id="flows-controls" class="tab-controls">
            <!-- Controles extras para fluxos se necessário -->
          </div>
        </div>
      </header>

      <!-- Conteúdo da Aba 1: Console de Logs -->
      <div id="tab-content-logs" class="tab-content active">
        <div class="terminal-container">
          <div id="terminal-logs" class="terminal-scroll">
            <div class="log-entry">
              <span class="log-timestamp">[--:--:--]</span>
              <span class="log-level info">[INFO]</span>
              <span class="log-text">Zwei Chat inicializado. Aguardando comandos...</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Conteúdo da Aba 2: Construtor de Fluxos -->
      <div id="tab-content-flows" class="tab-content"></div>

      <!-- Conteúdo da Aba 3: Dee Jay -->
      <div id="tab-content-deejay" class="tab-content"></div>
    </main>

  </div>

  <script src="../guiScripts/utils/confirmModal.js"></script>
  <script src="../guiScripts/deejay.js" defer></script>
  <script type="module" src="../guiScripts/flows.js" defer></script>
  <script src="../guiScripts/index.js"></script>
</body>
</html>
