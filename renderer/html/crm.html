<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM - Jubileu</title>
    <link rel="stylesheet" href="../css/globalCss.css">
    <link rel="stylesheet" href="../css/crm.css">
    <link rel="stylesheet" href="../css/darkMode.css">
</head>
<body>
    <div class="sidebar">
        <h2>👥 CRM</h2>
        
        <button class="menu-item active">
            <span>📊</span> Dashboard
        </button>
        <button class="menu-item">
            <span>👥</span> Contatos
        </button>
        <button class="menu-item">
            <span>🏷️</span> Tags
        </button>
        <button class="menu-item">
            <span>📅</span> Tarefas
        </button>
    </div>

    <div class="content">
        <div class="content-header">
            <h1>Dashboard CRM</h1>
            <p>Visão geral do relacionamento com clientes</p>
        </div>

        <div class="crm-stats">
            <div class="stat-card">
                <div class="stat-icon">👥</div>
                <div class="stat-info">
                    <h3>0</h3>
                    <p>Total de Contatos</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">✅</div>
                <div class="stat-info">
                    <h3>0</h3>
                    <p>Ativos</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📅</div>
                <div class="stat-info">
                    <h3>0</h3>
                    <p>Tarefas Hoje</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">💬</div>
                <div class="stat-info">
                    <h3>0</h3>
                    <p>Interações</p>
                </div>
            </div>
        </div>

        <div class="crm-card">
            <h3>Atividade Recente</h3>
            <p style="color: #666; padding: 20px 0; text-align: center;">Nenhuma atividade recente.</p>
        </div>
    </div>

    <script src="../guiScripts/utils/darkModeManager.js"></script>
    <!-- Placeholder for specific CRM scripts -->
    <!-- <script src="../guiScripts/crmRenderer.js"></script> -->
</body>
</html>
