<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM - Jubileu</title>
    <link rel="stylesheet" href="../css/globalCss.css">
    <link rel="stylesheet" href="../css/crm.css">
    <link rel="stylesheet" href="../css/darkMode.css">
    <link rel="stylesheet" href="../css/hotkeys.css">
</head>

<body>


    <div class="main-content">
        <div class="crm-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3>Instâncias CRM (Isoladas)</h3>
                <button id="btn-create-crm-instance" class="btn-primary">
                    ➕ Nova Instância
                </button>
            </div>

            <div id="crm-instances-list" class="crm-instances-grid">
                <!-- Lista será renderizada aqui -->
            </div>
        </div>

        <div class="crm-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3>Manifestos CRM</h3>
                <button id="btn-refresh-manifests" class="btn-secondary" style="background-color: transparent; border: 1px solid #ddd; padding: 5px 10px; cursor: pointer;">
                    🔄 Atualizar
                </button>
            </div>

            <div id="crm-manifests-list" class="crm-manifests-grid">
                <!-- Lista de manifestos será renderizada aqui -->
            </div>
        </div>

    </div>

    <!-- Modal de Criação -->
    <div id="modal-create-instance" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Nova Instância CRM</h3>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="input-instance-name">Nome da Instância</label>
                    <input type="text" id="input-instance-name" placeholder="Ex: Vendas 01">
                </div>
            </div>
            <div class="modal-footer">
                <button id="btn-cancel-create" class="btn-secondary">Cancelar</button>
                <button id="btn-confirm-create" class="btn-primary">Criar</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="../guiScripts/utils/darkModeManager.js"></script>
    <script src="../guiScripts/utils/confirmModal.js"></script>
    <script src="../guiScripts/utils/promptModal.js"></script>
    <script src="../guiScripts/utils/hotkeys.js"></script>
    <script src="../guiScripts/crmRenderer.js"></script>
</body>

</html>
