<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Bot</title>
    <link rel="stylesheet" href="../css/globalCss.css">
    <link rel="stylesheet" href="../css/index.css">
</head>

<body>
    <div class="container">
        <h1>🤖 Jubileu</h1>

        <div class="button-group">
            <button id="btn-start">
                <span class="btn-text">Iniciar WhatsApp</span>
            </button>
            <button id="btn-stop" class="stop-btn" disabled>Parar WhatsApp</button>
            <button id="btn-config" class="config-btn">Configurações</button>
        </div>

        <div id="status" class="hidden"></div>

        <div id="qr-container" class="qr-container hidden">
            <h3>Escaneie o QR Code com seu WhatsApp</h3>
            <img id="qr-image" class="qr-code" alt="QR Code">
            <div class="qr-instructions">
                <strong>Como conectar:</strong><br>
                1. Abra o WhatsApp no seu celular<br>
                2. Toque em "Configurações" > "Aparelhos conectados"<br>
                3. Toque em "Conectar um aparelho"<br>
                4. Escaneie este QR Code
            </div>
        </div>
    </div>

    <script src="../guiScripts/renderer.js"></script>
</body>

</html>
