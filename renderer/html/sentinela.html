<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jubileu - Sentinela</title>
    <link rel="stylesheet" href="../css/globalCss.css">
    <link rel="stylesheet" href="../css/darkMode.css">
    <link rel="stylesheet" href="../css/sentinela.css">
</head>
<body>
    <div class="sentinela-container">
        <!-- Header -->
        <header class="sentinela-header">
            <div class="header-title-container">
                <span class="sentinela-icon">👁️</span>
                <h1 class="sentinela-title">Sentinela</h1>
            </div>
            <p class="sentinela-subtitle">Monitoramento e Distribuição de DDDs</p>
        </header>

        <!-- Main Dashboard -->
        <main class="dashboard">
            <!-- Map Container -->
            <div class="map-card">
                <div id="brazil-map" class="map-container"></div>
            </div>
            
            <!-- Side Info Panel -->
            <div class="info-card">
                <h2>Filtros</h2>
                <div class="filter-section">
                    <span style="font-size: 14px; margin-bottom: 5px; display: block; color: #ccc;">Quantidade de DDDs:</span>
                    <div class="filter-controls">
                        <select id="filter-operator" class="modern-select">
                            <option value="<="><= (Até)</option>
                            <option value=">=">>= (A partir de)</option>
                            <option value="==">= (Exatamente)</option>
                        </select>
                        <input type="number" id="filter-value" class="modern-input" min="1" max="9" value="2">
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button id="btn-apply-filter" class="modern-btn apply-btn">Filtrar</button>
                        <button id="btn-clear-filter" class="modern-btn clear-btn">Limpar</button>
                    </div>
                </div>

                <h2>Região Selecionada</h2>
                <div id="region-info" class="region-info-content">
                    <p class="placeholder-text">Passe o mouse sobre um estado no mapa para visualizar a cobertura de DDDs.</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Bibliotecas e Scripts -->
    <script src="../libs/echarts.min.js"></script>
    <script src="../guiScripts/utils/darkModeManager.js"></script>
    <script src="../guiScripts/sentinelaRenderer.js"></script>
</body>
</html>
